    - title: The Button
      description:
        A simple clicker game with one rule - one click increases the counter
        by 1, but the chance of resetting the counter increases by 1%.
      techs:
        - title: React
          color: info
          icon: simple-icons:react
        - title: Tailwind
          color: info
          icon: simple-icons:tailwindcss
        - title: Bun
          color: base-content
          icon: simple-icons:bun
        - title: Fastify
          color: base3
          icon: simple-icons:fastify
        - title: Drizzle
          color: neutral
          icon: simple-icons:drizzle
        - title: Docker
          color: info
          icon: simple-icons:docker

      links:
        - title: Play it!
          target: _blank
          icon: ph:cursor-click-light
          color: accent
          url: https://btn.qpup.ru/
        - title: Code
          target: _blank
          icon: simple-icons:git
          url: https://github.com/wvovaw/the-button
      image:
        src: images/thebutton.png
        alt: The button game screenshot

    - title: Wasd Market
      description:
        Online marketplace of video games and other digital products. Featured
        with content management, dynamic pages, payments, e-mail notifications. Hosted
        on a VPS behind Nginx.
      techs:
        - title: Nuxt
          color: success
          icon: simple-icons:nuxtdotjs
        - title: Tailwind
          color: info
          icon: simple-icons:tailwindcss
        - title: Strapi
          color: primary
          icon: simple-icons:strapi
        - title: Nginx
          color: success
          icon: simple-icons:nginx
      links:
        - title: The project is closed
          target: _blank
          icon: material-symbols:open-in-new
          color: accent
      image:
        src: images/wasdmarket.png
        alt: wasdmarket screenshot

    - title: Blog
      description:
        Astro powered blog. Simple static blog website built on the Astro
        content API. Leverages the latest features of Astro, including View Transitoins
      techs:
        - title: Astro
