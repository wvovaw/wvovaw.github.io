    - title: Mars Gallery
      description:
        All NASA Mars rover photos in one place. It exposes the official
        NASA API to access photos of active rovers and my own API to access old inactive
        rovers photos. It provides a  common interface to access all of the NASA Mars
        rovers. Hosted on Netlify and Deno.com.
      techs:
        - title: Nuxt
          color: success
          icon: simple-icons:nuxtdotjs
        - title: Tailwind
          color: info
          icon: simple-icons:tailwindcss
        - title: Deno
          color: neutral
          icon: simple-icons:deno

      links:
